[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cogworks-week1-audio-benchmark"
version = "0.1.0"
description = "CogWorks Week 1 audio benchmark: song identification from short clips, scored by the portal controller"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24,<2",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "ruff>=0.4,<1"]

[project.entry-points."cogworks.benchmarks.v2"]
audio-identification = "audio_identification_benchmark.plugins:AudioIdentificationBenchmark"

[tool.setuptools.packages.find]
include = ["audio_identification_benchmark*"]

[tool.setuptools.package-data]
audio_identification_benchmark = ["manifests/*.json", "py.typed"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# Explicit so user-level ruff configs cannot change what CI enforces.
# Correctness families only; the py3.8-compatible typing spellings are
# deliberate, so the modernization (UP) family stays off.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B904"]
